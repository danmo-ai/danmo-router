name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          key: ${{ matrix.target }}

      - name: Build release binaries
        run: |
          cargo build -p danmo-server \
            --bin danmo-relay \
            --bin danmo-admin \
            --bin danmo-user \
            --release \
            --target ${{ matrix.target }}

      - name: Package
        run: |
          STAGE=danmo-router-${{ github.ref_name }}-${{ matrix.target }}
          mkdir -p "$STAGE"
          cp target/${{ matrix.target }}/release/danmo-relay \
             target/${{ matrix.target }}/release/danmo-admin \
             target/${{ matrix.target }}/release/danmo-user \
             .env.example \
             "$STAGE/"
          tar -czf "$STAGE.tar.gz" "$STAGE"
          echo "ASSET=$STAGE.tar.gz" >> "$GITHUB_ENV"

      - name: Upload asset
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: ${{ env.ASSET }}

  portals:
    name: Build portals
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            apps/admin/package-lock.json
            apps/user/package-lock.json

      - name: Build admin & user
        run: |
          (cd apps/admin && npm ci && npm run build)
          (cd apps/user && npm ci && npm run build)
          STAGE=danmo-portals-${{ github.ref_name }}
          mkdir -p "$STAGE/admin" "$STAGE/user"
          cp -R apps/admin/dist/. "$STAGE/admin/"
          cp -R apps/user/dist/. "$STAGE/user/"
          tar -czf "$STAGE.tar.gz" "$STAGE"
          echo "ASSET=$STAGE.tar.gz" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: release-portals
          path: ${{ env.ASSET }}

  publish:
    name: GitHub Release
    needs: [build, portals]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: release-*
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*
