name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}

jobs:
  ghcr:
    name: Build and push GHCR images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Integration tests
        run: cargo test -p danmo-server --test stack

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (relay)
        id: meta-relay
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/danmo-relay
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{raw}}
            type=raw,value=latest

      - name: Docker metadata (admin)
        id: meta-admin
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/danmo-admin
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{raw}}
            type=raw,value=latest

      - name: Docker metadata (user)
        id: meta-user
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/danmo-user
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{raw}}
            type=raw,value=latest

      - name: Docker metadata (edge)
        id: meta-edge
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/danmo-edge
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{raw}}
            type=raw,value=latest

      - name: Build and push danmo-relay
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: relay
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-relay.outputs.tags }}
          labels: ${{ steps.meta-relay.outputs.labels }}
          cache-from: type=gha,scope=danmo-rust
          cache-to: type=gha,mode=max,scope=danmo-rust

      - name: Build and push danmo-admin
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: admin
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-admin.outputs.tags }}
          labels: ${{ steps.meta-admin.outputs.labels }}
          cache-from: type=gha,scope=danmo-rust
          cache-to: type=gha,mode=max,scope=danmo-rust

      - name: Build and push danmo-user
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: user
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-user.outputs.tags }}
          labels: ${{ steps.meta-user.outputs.labels }}
          cache-from: type=gha,scope=danmo-rust
          cache-to: type=gha,mode=max,scope=danmo-rust

      - name: Build and push danmo-edge
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: edge
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-edge.outputs.tags }}
          labels: ${{ steps.meta-edge.outputs.labels }}
          cache-from: type=gha,scope=danmo-edge
          cache-to: type=gha,mode=max,scope=danmo-edge

  release-notes:
    name: GitHub Release notes
    needs: [ghcr]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## Container images (GHCR)

            | Image | Pull |
            |-------|------|
            | relay | `docker pull ghcr.io/${{ github.repository_owner }}/danmo-relay:${{ github.ref_name }}` |
            | admin | `docker pull ghcr.io/${{ github.repository_owner }}/danmo-admin:${{ github.ref_name }}` |
            | user | `docker pull ghcr.io/${{ github.repository_owner }}/danmo-user:${{ github.ref_name }}` |
            | edge | `docker pull ghcr.io/${{ github.repository_owner }}/danmo-edge:${{ github.ref_name }}` |

            Deploy with Compose from the repository:

            ```bash
            export DANMO_TAG=${{ github.ref_name }}
            cp .env.example .env   # set ENCRYPTION_KEY and domains
            ./deploy/scripts/install.sh --pull --no-build
            ```

            See [deploy/README.md](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/deploy/README.md).
