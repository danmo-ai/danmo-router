[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/relay",
    "crates/admin-api",
    "crates/user-api",
    "crates/server",
]

[workspace.package]
version = "0.4.0"
edition = "2021"
license = "MIT"
authors = ["danmo-ai"]

[workspace.dependencies]
anyhow = "1"
argon2 = "0.5"
aes-gcm = "0.10"
axum = { version = "0.8", features = ["macros"] }
axum-extra = { version = "0.10", features = ["cookie"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
hex = "0.4"
http = "1"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
# default-features off: avoid sqlx proc-macro dylib; we use runtime queries only.
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "any", "sqlite", "mysql", "chrono", "uuid", "derive", "migrate"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
futures = "0.3"
bytes = "1"
cookie = "0.18"
time = "0.3"
danmo-core = { path = "crates/core" }
danmo-relay = { path = "crates/relay" }
danmo-admin-api = { path = "crates/admin-api" }
danmo-user-api = { path = "crates/user-api" }
