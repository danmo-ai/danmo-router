# danmo-relay — TLS 终结 + 反代到本机 HTTP（流式/SSE 友好）
# 安装：复制到 /etc/nginx/conf.d/ ，修改 server_name 与证书路径，nginx -t && reload
#
# 前置：danmo-relay 监听 127.0.0.1:3000（或 0.0.0.0:3000，仅本机 Nginx 可达即可）

upstream danmo_relay {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.example.com;

    # Certbot 示例路径；云证书或自签请替换
    ssl_certificate     /etc/letsencrypt/live/api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;

    # 现代 TLS 基线（可按合规要求收紧）
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 64m;

    location / {
        proxy_pass http://danmo_relay;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }
}

# 可选：Certbot HTTP-01 或强制跳转到 HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name api.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
